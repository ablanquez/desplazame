<!doctype html>
<meta charset="utf-8">
<title>Desplázame · visor del grafo (instrumento de inspección)</title>
<!--
  ⚠️ ESTO NO ES UNA PANTALLA DE LA APLICACIÓN. Es un instrumento de inspección,
     como la bitácora es un registro y no documentación. Feo es aceptable;
     confuso, no. Aquí NO se deciden colores de marca, tipografía ni navegación.

  ⚠️ EL FONDO NO VERIFICA: SITÚA. El mapa de debajo también es OpenStreetMap, o
     sea la misma fuente con la que se construyó el grafo. Si el grafo arrastra un
     error heredado de OSM, el fondo lo confirmará tan contento. Lo que verifica
     es una persona reconociendo calles que ha andado.

  Se abre con doble clic. Necesita internet para Leaflet y para el fondo.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./grafo-visor.js"></script>
<style>
  html,body{margin:0;height:100%;font:13px/1.45 system-ui,sans-serif}
  #mapa{height:100%}
  .panel{background:#fff;padding:10px 12px;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.35);
         max-width:290px;max-height:88vh;overflow:auto}
  .panel h4{margin:.6em 0 .3em;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#444}
  .panel h4:first-child{margin-top:0}
  .sw{display:inline-block;width:22px;height:4px;vertical-align:middle;margin-right:6px;border-radius:2px}
  .pt{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:6px}
  .muted{color:#666}
  .aviso{background:#fff8e1;border-left:3px solid #f0ad00;padding:6px 8px;margin-top:8px;font-size:12px}
  code{background:#f2f2f2;padding:0 3px;border-radius:2px}
  .leaflet-popup-content{font:12px/1.5 ui-monospace,monospace}
</style>
<div id="mapa"></div>
<script>
const G = window.GRAFO;
if (!G) { document.body.innerHTML = '<p style="padding:2em">⛔ Falta <code>grafo-visor.js</code>. Genéralo con <code>node src/exportar.js</code></p>'; throw new Error('sin datos'); }

// ── D4 · la precisión, que es el reparto que justificó meter OSM ─────────────
const COLOR_PRECISION = {
  'acera':                    '#1a7f37',
  'paso-de-peatones':         '#8250df',
  'peatonal':                 '#0969da',
  'escaleras':                '#bf3989',
  'eje-con-acera-declarada':  '#9a6700',
  'eje-de-calzada':           '#cf222e',
};
// Paleta para las componentes pequeñas. La grande va en gris apagado a propósito:
// lo que hay que mirar son las 19 islitas, no el 99 % que ya se sabe que está bien.
const PALETA = ['#e51c23','#ff9800','#259b24','#5677fc','#9c27b0','#00bcd4','#795548',
                '#ff5722','#8bc34a','#3f51b5','#e91e63','#009688','#cddc39','#673ab7',
                '#f44336','#03a9f4','#4caf50','#ffc107','#607d8b','#9e9e9e'];

const zc = G.zona;
const mapa = L.map('mapa').fitBounds([[zc.sur, zc.oeste], [zc.norte, zc.este]]);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 20, attribution: '© OpenStreetMap' }).addTo(mapa);
// el rectángulo de la zona, para ver de un vistazo QUÉ se ha planarizado y qué no
L.rectangle([[zc.sur, zc.oeste], [zc.norte, zc.este]],
  { color: '#000', weight: 1, dashArray: '6 4', fill: false, interactive: false }).addTo(mapa);

const ll = (g) => g.map((p) => [p[1], p[0]]);
const esc = (s) => String(s === null || s === undefined ? '—' : s)
  .replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

// ── capa 1 · todas las aristas, color por precisión ─────────────────────────
const capaPrecision = L.layerGroup();
for (const a of G.aristas) {
  L.polyline(ll(a.g), {
    color: COLOR_PRECISION[a.p] || '#000',
    weight: a.a ? 3 : 2,
    opacity: a.a ? 0.85 : 0.35,
    dashArray: a.a ? null : '3 3',
  }).bindPopup(
    `<b>arista ${a.i}</b><br>way OSM <a href="https://www.openstreetmap.org/way/${a.w}" target="_blank">${a.w}</a><br>`
    + `highway = ${esc(a.h)}<br>precisión (D4) = <b>${esc(a.p)}</b><br>`
    + `largo = ${a.m} m<br>componente = ${a.c}<br>`
    + `transitable a pie = ${a.a ? 'sí' : '<b>NO</b>'}<br>`
    + `unido-por-defecto (D2) = ${a.d ? '<b>SÍ</b>' : 'no'}`
  ).addTo(capaPrecision);
}

// ── capa 2 · componentes ────────────────────────────────────────────────────
const capaComponentes = L.layerGroup();
const mayor = G.contadores.mayor;
for (const a of G.aristas) {
  const esMayor = a.c === mayor;
  L.polyline(ll(a.g), {
    color: esMayor ? '#c8c8c8' : PALETA[a.c % PALETA.length],
    weight: esMayor ? 1.5 : 6,
    opacity: esMayor ? 0.55 : 1,
  }).bindPopup(`<b>componente ${a.c}</b> — ${G.componentes[a.c] ? G.componentes[a.c].nodos : '?'} nodos`
    + `<br>arista ${a.i}, way ${a.w}, ${esc(a.h)}`).addTo(capaComponentes);
}
// un marcador por componente pequeña, para que se vean SIN hacer zoom (C3)
for (const c of G.componentes) {
  if (c.k === mayor) continue;
  const ar = G.aristas.filter((a) => a.c === c.k);
  if (!ar.length) continue;
  const p = ar[0].g[0];
  L.circleMarker([p[1], p[0]], { radius: 13, color: PALETA[c.k % PALETA.length],
    weight: 3, fill: false })
    .bindPopup(`<b>componente ${c.k}</b><br>${c.nodos} nodos, ${ar.length} aristas<br>`
      + `ways: ${[...new Set(ar.map((a) => a.w))].slice(0, 5).join(', ')}`)
    .addTo(capaComponentes);
}

// ── capa 3 · los 6 unido-por-defecto (D2) ───────────────────────────────────
const capaDefecto = L.layerGroup();
for (const d of G.porDefecto) {
  L.marker([d.g[1], d.g[0]]).bindPopup(
    `<b>unido-por-defecto nº${d.n}</b><br>`
    + `Se unió SIN evidencia de desnivel.<br><br>`
    + `A: way ${d.wayA} · ${esc(d.hwA)}<br>&nbsp;&nbsp;&nbsp;${esc(d.nombreA)}<br>`
    + `B: way ${d.wayB} · ${esc(d.hwB)}<br>&nbsp;&nbsp;&nbsp;${esc(d.nombreB)}`
  ).addTo(capaDefecto);
  L.circleMarker([d.g[1], d.g[0]], { radius: 16, color: '#000', weight: 3, fill: false })
    .addTo(capaDefecto);
}

// ── capa 4 · los 43 NO unidos por evidencia ─────────────────────────────────
const capaNoUnidos = L.layerGroup();
for (const d of G.noConectados) {
  const col = d.motivo === 'bridge' ? '#d00' : '#06c';
  L.circleMarker([d.g[1], d.g[0]], { radius: 7, color: col, weight: 2,
    fillColor: col, fillOpacity: 0.35 }).bindPopup(
    `<b>NO unido nº${d.n}</b> — motivo: <b>${esc(d.motivo)}</b><br><br>`
    + `A: way ${d.wayA} · ${esc(d.nombreA)}<br>B: way ${d.wayB} · ${esc(d.nombreB)}`
  ).addTo(capaNoUnidos);
}

// ── capa 5 · las 51 puntas entre 2 y 5 m sin soldar (D5) ────────────────────
const capaPuntas = L.layerGroup();
for (const p of G.puntasLejos) {
  L.polyline([[p.g[1], p.g[0]], [p.g2[1], p.g2[0]]],
    { color: '#ff00aa', weight: 4, dashArray: '4 3' })
    .bindPopup(`<b>punta sin soldar nº${p.n}</b><br>separación <b>${p.d} m</b><br>`
      + `D5 suelda hasta 2,0 m; el techo duro es 5,0 m.<br>Ésta queda CONTADA y sin tocar.`)
    .addTo(capaPuntas);
  L.circleMarker([p.g[1], p.g[0]], { radius: 5, color: '#ff00aa', weight: 2, fill: false })
    .addTo(capaPuntas);
}

capaPrecision.addTo(mapa);
capaDefecto.addTo(mapa);

L.control.layers(null, {
  '1 · aristas por precisión (D4)': capaPrecision,
  '2 · componentes conexas': capaComponentes,
  ['3 · unido-por-defecto (D2) — ' + G.porDefecto.length]: capaDefecto,
  ['4 · NO unidos por evidencia — ' + G.noConectados.length]: capaNoUnidos,
  ['5 · puntas 2–5 m sin soldar — ' + G.puntasLejos.length]: capaPuntas,
}, { collapsed: false }).addTo(mapa);

// ── leyenda: tiene que entenderse SIN haber leído ningún documento ──────────
const leyenda = L.control({ position: 'bottomleft' });
leyenda.onAdd = function () {
  const d = L.DomUtil.create('div', 'panel');
  d.innerHTML = `
    <h4>Qué es esto</h4>
    <div class="muted">La red que usa el motor para calcular rutas a pie, dibujada
    encima del mapa. Cada línea es un tramo entre dos cruces.</div>

    <h4>Colores de las líneas (capa 1)</h4>
    ${Object.entries(COLOR_PRECISION).map(([k, v]) =>
      `<div><span class="sw" style="background:${v}"></span>${k}</div>`).join('')}
    <div class="muted" style="margin-top:4px">Las tres primeras son las buenas: sabemos
    por dónde se anda de verdad. <b>Rojo</b> = solo tenemos el eje de la calle, sin saber
    si hay acera ni por dónde se cruza.</div>
    <div class="muted" style="margin-top:4px">Línea <b>de puntos y clarita</b> = existe
    pero <b>no se puede ir a pie</b> (autovía, obras…).</div>

    <h4>Los sitios dudosos</h4>
    <div><span class="pt" style="border:3px solid #000"></span><b>Unido por defecto</b>:
      dos calles se cruzan y <i>nada</i> en el dato dice si una pasa por encima. Se han
      unido, y se cuentan para poder revisarlos.</div>
    <div style="margin-top:3px"><span class="pt" style="background:#06c"></span>
      <b>No unido</b> porque el dato dice que están a distinta altura (<code>layer</code>).</div>
    <div style="margin-top:3px"><span class="pt" style="background:#d00"></span>
      <b>No unido</b> porque una es un <b>puente</b>.</div>
    <div style="margin-top:3px"><span class="sw" style="background:#ff00aa"></span>
      <b>Puntas sueltas</b>: dos tramos que casi se tocan (entre 2 y 5 m) y que
      <b>no</b> se han unido. Si alguna es una calle que sí continúa, es un fallo.</div>

    <h4>Componentes (capa 2)</h4>
    <div class="muted">Trozos de red que <b>no se comunican entre sí</b>. En gris el grande
    (${G.contadores.tamanoMayor} nodos); <b>de colores las ${G.contadores.componentes - 1}
    islitas</b>, con un círculo alrededor para encontrarlas.
    <b>Si alguna es un sitio por el que se puede llegar andando, es un fallo del grafo.</b></div>

    <div class="aviso">⚠️ <b>El mapa de fondo también es OpenStreetMap</b>, la misma fuente
    con la que se construyó el grafo. Si el grafo hereda un error de OSM, <b>el fondo lo
    confirmará</b>. El fondo <b>sitúa</b>; no verifica.</div>

    <h4>Dato</h4>
    <div class="muted">sello <code>${G.sello}</code><br>
    ${G.contadores.aristas} aristas · ${G.contadores.nodos} nodos ·
    ${G.contadores.componentes} componentes<br>
    zona: recuadro de puntos negros</div>`;
  L.DomEvent.disableClickPropagation(d);
  return d;
};
leyenda.addTo(mapa);
</script>
