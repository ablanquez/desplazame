<!doctype html>
<!-- ⭐ SIN `data-theme` (16/09, tanda 6 · parte 3), y el hueco donde estaba es
     parte del arreglo. Aqui ponia `data-theme="light"` mientras duraba la
     migracion de los componentes, y eso dejaba el §35 escrito entero en el CSS
     y DESCONECTADO en la practica: el `:not([data-theme='light'])` de la capa 2
     no casaba nunca, asi que `prefers-color-scheme` no mandaba en nada. Medido
     el 16/09 con el sistema en oscuro emulado antes de navegar: fondo pintado
     `rgb(255, 255, 255)`. Sin el atributo, el tema lo deciden las tres capas de
     `styles.css` y el guion de abajo. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Desplázame</title>
  <base href="/">

  <!--
    ⭐ EL GUION ANTI-FOUC — INLINE, BLOQUEANTE Y EL PRIMERO DE TODOS.

    [DISEÑO §35] la eleccion manual va persistida y **gana** al media query. Para
    que gane SIN FLASH tiene que estar puesta antes del primer pintado, y eso
    solo lo consigue un guion inline en el `<head>` **delante de las hojas**: un
    `defer`, un `async` o un `src` lo sacan del camino critico y devuelven el
    fogonazo blanco a quien guardo el oscuro. Por eso no lleva ninguno de los
    tres, y por eso vive aqui arriba y no en el bundle.

    ⚠️ `try/catch` OBLIGATORIO: en modo privado `localStorage` **lanza** al
       tocarlo. Sin el, la excepcion sube, el guion muere, y se lleva por delante
       la supresion de transiciones de la linea siguiente.

    ⚠️ SIN ELECCION GUARDADA NO SE ESTAMPA NADA, y no es un olvido. Estampar
       aqui el tema del sistema seria una SEGUNDA COPIA de la prioridad —la que
       ya escribe la capa 2 de `styles.css`— y ademas mataria el sistema vivo:
       con el atributo puesto, cambiar el SO con la pestaña abierta no haria
       nada. La capa 2 ES el respaldo que el §35 firma; aqui no se repite.

    ⚠️ LA TRAMPA DE LAS TRANSICIONES: las que animan el cambio de tema animan
       tambien su PRIMERA aplicacion, y eso se ve como un flash aunque el
       atributo llegue a tiempo. Se apagan con `.sin-transiciones` y se
       devuelven tras el primer pintado — DOS vueltas de `requestAnimationFrame`,
       porque una sola corre todavia ANTES de pintar.

    ⚠️ La llave esta escrita tambien en `tema.ts`, que es quien la guarda. Aqui
       no se puede importar nada: esto corre antes de que existan los modulos.
       Las dos las compara una jueza de `tema.spec.ts`.
  -->
  <script>
    (function () {
      var raiz = document.documentElement;
      raiz.classList.add('sin-transiciones');
      try {
        var guardada = localStorage.getItem('desplazame:tema');
        if (guardada === 'dark' || guardada === 'light') {
          raiz.setAttribute('data-theme', guardada);
        }
      } catch (e) {
        /* modo privado: el almacenamiento lanza. Se sigue sin eleccion. */
      }
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          raiz.classList.remove('sin-transiciones');
        });
      });
    })();
  </script>
  <!-- ⭐ `viewport-fit=cover` (11/09, tanda de móvil) — y NO es cosmético.
       [DOC MDN, `env()`] las variables `safe-area-inset-*` **valen 0 mientras el
       viewport no sea `cover`**. La barra de pestañas pide
       `env(safe-area-inset-bottom)` de relleno para no quedarse debajo del
       indicador de inicio de un iPhone; sin esta palabra, ese relleno sería 0 y
       la barra estaría tapada justo en el aparato para el que se ha hecho.
       ⚠️ Y `cover` tiene contrapartida: la página pasa a ocupar TAMBIÉN las zonas
          inseguras, así que el relleno deja de ponerlo el navegador y pasa a ser
          nuestro. Lo que quedaba pegado a un borde está censado y medido: la
          barra es lo único, y lleva el suyo. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    ⭐ EL FAVICON DE LA MARCA (18/09, el remate de la identidad).

    Aqui habia UNA sola linea, `<link rel="icon" type="image/x-icon"
    href="favicon.ico">`, y lo que servia era **el favicon por defecto que dejo
    el andamiaje de Angular** el 16/08: 15.086 bytes, tres tamaños (48, 32 y
    16), sin ninguna relacion con este producto. Queda declarado y se queda en
    su sitio — ver abajo.

    ⚠️ **AQUI PONIA que «el navegador se queda con la ultima declaracion que
       entienda»**, y eso NO es lo que dice MDN — se comprobo el 28/09 leyendo
       la fuente en vez de citarla de memoria. Lo que dice, literal:

         «If there are multiple <link rel="icon">s, the browser uses their
          media, type, and sizes attributes to select the most appropriate
          icon. If several icons are equally appropriate, THE LAST ONE IS USED.
          If the most appropriate icon is later found to be inappropriate, for
          example because it uses an unsupported format, the browser proceeds
          to the next-most appropriate, and so on.»
         [MDN · HTML attribute: rel — rel=icon]

       O sea: lo primero que mira son `media`, `type` y `sizes`, y **«la ultima»
       es solo el DESEMPATE** entre candidatas igual de buenas. Con las dos
       lineas peladas que habia aqui, todo era desempate — y de ahi salia la
       nota vieja, que describia el sintoma y no la regla.

    ⭐ **Por eso las dos llevan ahora su `sizes`**: el `.ico` declara los tres
       tamaños que trae de verdad y el vectorial declara `any`, que es como un
       SVG dice «yo sirvo para cualquier talla». Asi cada navegador elige por lo
       que necesita en vez de por el orden, y el orden deja de cargar con una
       decision que no le tocaba. Se conserva igualmente el `.ico` DELANTE: si
       alguna vez las dos empatan, la ultima —la vectorial— sigue ganando.

    ⚠️ **La media query vive DENTRO del propio SVG** [§36 · DOC MDN]: un favicon
       no hereda el tema de la pagina —se pinta en la pestaña, fuera de ella—,
       pero si puede leer `prefers-color-scheme` desde un `<style>` embebido.
       Por eso responde al SISTEMA y no al conmutador: es lo unico que un
       favicon puede leer, y se declara asi en vez de fingir que sigue al tema.

    ⚠️ **Y AQUI PONIA que el `.ico` se quedaba a la cola** porque cambiarlo
       «pide un rasterizador que este repositorio no tiene». Lo tiene: **el
       Chrome del arnes**, conducido por CDP, que es con lo que esta casa mide
       pixeles desde el primer dia. El 28/09 el `.ico` paso a ser LA MARCA,
       rasterizada desde `app/marca/favicon.svg` a 16, 32 y 48. Ninguna
       dependencia nueva: el comando esta escrito en `app/marca/PROCEDENCIA.md`.

    ⚠️ **El `.ico` es del tema CLARO, y no puede ser de otro**: un raster no lee
       `prefers-color-scheme`. Se rasterizo con lo que el navegador ve sin
       emular nada —MEDIDO: `light`—, asi que lleva el azul `#2563eb`. Quien
       entienda el SVG vera el color de su tema; quien no, este.
  -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48 32x32 16x16">
  <link rel="icon" type="image/svg+xml" href="favicon.svg" sizes="any">

  <!--
    ⭐ EL APP-ICON, CABLEADO (28/09, dictado de Antonio).

    Se produjo el 18/09 y se dejo SIN CABLEAR a proposito, con una jueza que
    fijaba ese estado «para que cablearlo sea una decision y no un descuido»
    [DISEÑO §39.6]. Esta es la decision, y la jueza cambio de sentido con ella.

    ⚠️ **`display: "browser"` en el manifest, y es una firma de Antonio**: esto
       NO es una PWA —no hay service worker ni nada fuera de linea—, asi que
       declararla instalable seria mentirle a quien la instale. El manifest esta
       para el nombre, el color y los iconos del sistema; el dia que se quiera
       instalable, es otra decision.
  -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">

  <!--
    ⭐ EL PRELOAD DE LA LETRA CRITICA (tanda 2).

    Una fuente declarada en el CSS no empieza a bajarse hasta que el navegador
    ha construido el CSSOM Y ha encontrado texto que la use: llega tarde, y con
    `font-display: swap` eso se ve como un cambio de letra a mitad de carga.
    Este `preload` la pide desde la primera linea del HTML, en paralelo con
    todo lo demas.

    ⚠️ SOLO EL PESO 400. Es el del texto corrido; el 500 y el 600 se usan en
       trozos sueltos, y precargarlos seria bajar 229 kB que casi nadie mira
       antes de tiempo. Precargar de mas compite con el CSS y el JS por el
       ancho de banda, que es justo lo contrario de lo que se busca.

    ⚠️ Y LA URL TIENE QUE SER LA MISMA, LETRA POR LETRA, que la del
       `@font-face` de `styles.css`. Si no casan, el navegador no reconoce lo
       precargado y **se baja el fichero dos veces**. Aqui las dos son
       `/fuentes/Inter-Regular.woff2`, absolutas desde la raiz.

    `crossorigin` no es opcional ni decorativo: las fuentes se piden en modo
    anonimo aunque sean del propio dominio, y sin el atributo la peticion
    precargada no coincide con la real — el mismo doble descargue.
  -->
  <link rel="preload" href="/fuentes/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <!--
    ⭐ QUE NO SE QUEDE MUDA SIN JAVASCRIPT (B-3, 24/09).

    Medido: el cuerpo servido de las cinco rutas da **0 caracteres de texto** una
    vez quitados los `<script>`. El unico `<noscript>` que habia en el `dist` no
    es un mensaje: es el respaldo de la hoja de estilos que mete *beasties*
    (`<noscript><link rel="stylesheet" ...></noscript>`), con cero texto. Quien
    llegue con JavaScript desactivado veia **una pagina en blanco**, sin saber si
    el sitio esta roto, si no existe o si le falta algo a su navegador.

    Esto NO da contenido —la aplicacion sigue necesitando JavaScript—: quita la
    pagina muda, que es otra cosa y es la que se puede arreglar hoy. Prerenderizar
    las rutas estaticas es una tanda propia y toca la tuberia de construccion.

    Texto firmado por Antonio.
  -->
  <noscript>
    <p style="margin: 2rem auto; max-width: 34rem; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.5">
      Desplázame es un buscador de rutas de Zaragoza. Necesita JavaScript activado para funcionar.
    </p>
  </noscript>
  <app-root></app-root>
</body>
</html>
