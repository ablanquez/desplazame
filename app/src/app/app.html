<main class="pantalla">
  <header class="cabecera">
    <h1>Desplázame</h1>
    <p>Cómo ir de un portal a otro en Zaragoza.</p>
  </header>

  <form class="buscador" (submit)="$event.preventDefault()">
    <fieldset class="punto">
      <legend>Origen</legend>
      <label class="campo campo--calle">
        <span>Calle</span>
        <input type="text" name="calleOrigen" [(ngModel)]="calleOrigen" autocomplete="off" />
      </label>
      <label class="campo campo--portal">
        <span>Portal</span>
        <input type="text" name="portalOrigen" [(ngModel)]="portalOrigen" autocomplete="off" />
      </label>
    </fieldset>

    <fieldset class="punto">
      <legend>Destino</legend>
      <label class="campo campo--calle">
        <span>Calle</span>
        <input type="text" name="calleDestino" [(ngModel)]="calleDestino" autocomplete="off" />
      </label>
      <label class="campo campo--portal">
        <span>Portal</span>
        <input type="text" name="portalDestino" [(ngModel)]="portalDestino" autocomplete="off" />
      </label>
    </fieldset>

    <fieldset class="modos">
      <legend>Cómo</legend>
      @for (m of modos; track m.id) {
        <button
          type="button"
          class="modo"
          [class.modo--activo]="modo() === m.id"
          [attr.aria-pressed]="modo() === m.id"
          (click)="elegirModo(m.id)"
        >
          {{ m.etiqueta }}
        </button>
      }
    </fieldset>
  </form>

  <section class="mapa-hueco" aria-label="Mapa">
    <p>Aquí va el mapa.</p>
    <p class="mapa-hueco__nota">Llega en el punto 3 del plan. Todavía no hay nada de mapa.</p>
  </section>

  <section class="pasos" aria-label="Indicaciones">
    <h2>Indicaciones</h2>
    <p class="pasos__vacio">
      Todavía no hay pasos. Rellena los cuatro campos y pulsa «Generar ruta».
    </p>
  </section>
</main>
